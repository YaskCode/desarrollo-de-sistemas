name: Guía pública del codelab
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar renderizador
        run: python -m pip install Django==5.2.19
      - name: Construir guía pública sin variables PP4
        run: python scripts/construir_codelab.py
      - name: Guardar vista previa de la guía
        uses: actions/upload-artifact@v4
        with:
          name: guia-publica-codelab
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar guía estática
        id: deployment
        uses: actions/deploy-pages@v4

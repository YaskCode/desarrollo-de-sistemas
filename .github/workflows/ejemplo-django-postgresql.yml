name: Ejemplo Django y PostgreSQL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ejemplo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ejemplos/django-postgresql
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pp4_desarrollo
          POSTGRES_USER: pp4_local
          POSTGRES_PASSWORD: pp4_ci_efimera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp4_local -d pp4_desarrollo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PP4_DB_NAME: pp4_desarrollo
      PP4_DB_USER: pp4_local
      PP4_DB_PASSWORD: pp4_ci_efimera
      PP4_DB_HOST: 127.0.0.1
      PP4_DB_PORT: "5432"
      PP4_SECRET_KEY: clave-solo-para-pruebas-efimeras-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ejemplos/django-postgresql/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar dependencias y configuración
        run: |
          python -m pip check
          python manage.py check
      - name: Comprobar y aplicar migraciones
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Ejecutar pruebas
        run: python -m pytest -q --junitxml=reporte-pruebas.xml
      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-postgresql
          path: ejemplos/django-postgresql/reporte-pruebas.xml
          if-no-files-found: ignore
          retention-days: 7
